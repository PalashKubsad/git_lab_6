name: Continuous Integration

on:
  push:
    branches: [ main ]

jobs:
  check-file:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check student data file
        shell: bash
        run: |
          if [ -f studentdata.txt ]; then
            echo "File exists"
          else
            exit 1
          fi